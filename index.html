<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited! ✨ Vanessa 的生日派對</title>

  <!-- LINE / 社群分享卡片設定 (OG Tags) -->
  <meta property="og:title" content="🎉 Vanessa 的生日派對邀請函 🎂">
  <meta property="og:description" content="誠摯邀請你來參加大寶寶的生日派對！點擊開啟專屬邀請函。">
  <meta property="og:type" content="website">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-gold: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Noto Serif TC', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* 邀請函主容器 */
    .invitation-container {
      width: 100%;
      max-width: 420px;
      perspective: 1000px;
    }

    /* 卡片主體 */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 16px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(251, 191, 36, 0.1);
      position: relative;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 封面狀態 */
    .card.closed .content-inside {
      display: none;
    }

    .card.open .cover-content {
      display: none;
    }

    .card.open {
      animation: openCard 0.8s forwards;
    }

    @keyframes openCard {
      0% { transform: rotateY(90deg); opacity: 0; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }

    /* 封面設計 */
    .cover-content {
      padding: 20px 0;
    }

    .envelope-icon {
      font-size: 3rem;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .cover-title {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    .cover-subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    .btn-open {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #000;
      border: none;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
      transition: all 0.3s ease;
    }

    .btn-open:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(251, 191, 36, 0.6);
    }

    /* 音樂按鈕 (右上角) */
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      z-index: 10;
    }

    .card.open .music-btn {
      display: flex;
    }

    /* 照片樣式 */
    .party-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-gold);
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
      margin: 0 auto 15px auto;
      display: block;
    }

    /* 內部內容設計 */
    .header-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      font-weight: 600;
      line-height: 1.4;
    }

    .message {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    /* 派對資訊框 */
    .details-box {
      background: rgba(15, 23, 42, 0.6);
      border-left: 2px solid var(--accent-gold);
      padding: 20px;
      border-radius: 0 12px 12px 0;
      text-align: left;
      margin-bottom: 30px;
    }

    .detail-item {
      margin-bottom: 12px;
      font-size: 0.95rem;
      display: flex;
      align-items: flex-start;
    }

    .detail-item:last-child {
      margin-bottom: 0;
    }

    .icon {
      margin-right: 12px;
      font-size: 1.1rem;
      line-height: 1.4;
    }

    .map-link {
      color: var(--accent-gold);
      text-decoration: underline;
      font-weight: 600;
      word-break: break-all;
    }

    .map-link:hover {
      opacity: 0.8;
    }

    /* 倒數計時 */
    .countdown-title {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .time-unit {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      min-width: 55px;
    }

    .number {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--accent-gold);
      font-weight: bold;
    }

    .label {
      font-size: 0.7rem;
      color: var(--text-sub);
    }

    .footer-note {
      font-size: 0.85rem;
      color: var(--accent-gold);
      opacity: 0.8;
    }

    /* 禮花特效小點 */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--accent-gold);
      border-radius: 50%;
      pointer-events: none;
      animation: fly 1s ease-out forwards;
    }

    @keyframes fly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tw-x), var(--tw-y)) scale(0); }
    }
  </style>
</head>
<body>

  <!-- 背景音樂 (請替換為你的音樂檔名) -->
  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div class="invitation-container">
    <div class="card closed" id="card">
      
      <!-- 右上角音樂控制鈕 -->
      <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>

      <!-- 封面 -->
      <div class="cover-content">
        <div class="envelope-icon">✉️</div>
        <div class="cover-title">YOU'RE INVITED</div>
        <div class="cover-subtitle">有一封來自 Vanessa 的專屬邀請函</div>
        <button class="btn-open" onclick="openCard()">開啟邀請函</button>
      </div>

      <!-- 展開後的內容 -->
      <div class="content-inside">
        <div class="header-tag">Birthday Celebration</div>
        
        <!-- 個人照/派對主圖 (請替換為你的圖片檔名) -->
        <img src="photo.jpg" alt="Vanessa" class="party-photo">

        <h1>🎉🥳 邀請你來參加大寶寶的生日派對! 🎊🎂</h1>
        <p class="message">
          安安！<br>
          收到這封邀請函表示你報名成功了!<br>
          我知道你跟我一樣非常期待😎<br>
          希望大家都能玩得開心。
        </p>

        <div class="details-box">
          <div class="detail-item">
            <span class="icon">📅</span>
            <span><strong>時間：</strong>2026.08.29 (Sat.) 20:00</span>
          </div>
          <div class="detail-item">
            <span class="icon">📍</span>
            <span>
              <strong>地點：</strong>
              <a href="https://maps.app.goo.gl/6W4a8GHYiEomD26T7" target="_blank" rel="noopener noreferrer" class="map-link">
                麥當勞-竹北中華 🗺️ (點擊開啟地圖)
              </a>
            </span>
          </div>
        </div>

        <div class="countdown-title">距離派對開始還有</div>
        <div class="countdown">
          <div class="time-unit">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
          </div>
          <div class="time-unit">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
          </div>
          <div class="time-unit">
            <div class="number" id="mins">00</div>
            <div class="label">MINS</div>
          </div>
        </div>

        <div class="footer-note">See you! ✌️🤩</div>
      </div>

    </div>
  </div>

  <script>
    let isPlaying = false;

    function openCard() {
      const card = document.getElementById('card');
      card.classList.remove('closed');
      card.classList.add('open');
      createSparkles();
      playMusic();
    }

    // 播放音樂
    function playMusic() {
      const audio = document.getElementById('bgm');
      audio.play().then(() => {
        isPlaying = true;
        document.getElementById('musicBtn').innerText = '🎵';
      }).catch(err => {
        console.log("自動播放被阻擋，需使用者手動點擊音樂鈕:", err);
      });
    }

    // 切換音樂開關
    function toggleMusic() {
      const audio = document.getElementById('bgm');
      const btn = document.getElementById('musicBtn');
      if (isPlaying) {
        audio.pause();
        btn.innerText = '🔇';
        isPlaying = false;
      } else {
        audio.play();
        btn.innerText = '🎵';
        isPlaying = true;
      }
    }

    // 火花散射效果
    function createSparkles() {
      const card = document.getElementById('card');
      for (let i = 0; i < 20; i++) {
        const sparkle = document.createElement('div');
        sparkle.classList.add('sparkle');
        const x = (Math.random() - 0.5) * 300;
        const y = (Math.random() - 0.5) * 300;
        sparkle.style.setProperty('--tw-x', `${x}px`);
        sparkle.style.setProperty('--tw-y', `${y}px`);
        sparkle.style.left = '50%';
        sparkle.style.top = '50%';
        card.appendChild(sparkle);

        setTimeout(() => sparkle.remove(), 1000);
      }
    }

    // 倒數計時器設定
    const targetDate = new Date('2026-08-29T20:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance > 0) {
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('mins').innerText = String(minutes).padStart(2, '0');
      } else {
        document.getElementById('days').innerText = '00';
        document.getElementById('hours').innerText = '00';
        document.getElementById('mins').innerText = '00';
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
